<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evolv</title>
<meta name="description" content="A work surface that reads capability from ordinary work. A student writes, and their own record fills in beside them as they go.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="wordmark">evolv</div>
  <nav class="tabs" id="tabs">
    <button data-view="student" class="on">Student</button>
    <button data-view="teacher">Teacher</button>
  </nav>
  <div class="chrome-right">
    <span class="integration off" id="intLang">language <b>·</b></span>
    <span class="integration off" id="intImg">images <b>·</b></span>
    <button class="ghostbtn" id="btnTrace">trace</button>
    <button class="ghostbtn" id="btnWhy">?</button>
  </div>
</header>

<main id="main">

  <!-- ---------- student view: the work, with their own record beside it ---------- -->
  <section id="studentView" class="view">
    <div class="workmain">
      <div class="doccol" id="doccol"></div>
      <aside class="margincol" id="margin"></aside>
    </div>
    <aside class="sidebar" id="sidebar">
      <div class="side-head">
        <span class="ovl">Your record</span>
        <div class="side-sub" id="sideSub">Fills in as you work. Nothing else is collected.</div>
      </div>
      <div class="side-body" id="sideBody"></div>
    </aside>
  </section>

  <!-- ---------- teacher view: the brief, and the same record ---------- -->
  <section id="teacherView" class="view hide">
    <div class="teachwrap">
      <div class="teachleft">
        <span class="ovl">The brief you set</span>
        <div class="card brief-sheet" id="teachBrief"></div>
      </div>
      <div class="teachright">
        <div class="side-head" style="padding:0 0 14px">
          <span class="ovl">Amara Osei · her record</span>
          <div class="side-sub">The same record she sees. A record about a person that the person cannot see is surveillance.</div>
        </div>
        <div id="teachRecord"></div>
      </div>
    </div>
  </section>

</main>

<div class="pill" id="pill">
  <button data-act="update">Update</button>
  <div class="sep"></div>
  <button data-act="ask">Ask</button>
  <div class="sep"></div>
  <button data-act="tag">Tag for research</button>
  <div class="sep"></div>
  <button data-act="image">Picture it</button>
</div>

<div class="askform" id="askform">
  <input id="askInput" placeholder="Ask about this passage">
  <button id="askGo" class="btn small solid">Ask</button>
</div>

<div class="veil" id="veil"><div class="modal" id="modal"></div></div>

<script type="module" src="app.js"></script>
</body>
</html>
