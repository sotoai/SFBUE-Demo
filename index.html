<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evolv</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

<header>
  <div class="wordmark">evolv</div>
  <div class="seat" id="seat">
    <span class="dot"></span>
    <span class="who" id="seatWho">·</span>
    <span class="name" id="seatName"></span>
    <span class="place" id="seatPlace"></span>
  </div>
  <div class="chrome-right">
    <span class="integration off" id="intLang">language <b>·</b></span>
    <span class="integration off" id="intImg">images <b>·</b></span>
    <button class="ghostbtn" id="btnWhy">?</button>
    <button class="ghostbtn" id="btnTrace">trace</button>
  </div>
</header>

<main>
  <!-- evaluator view, which later narrows into this same element as a panel -->
  <aside class="panel hide" id="panel">
    <div class="panel-head">
      <span class="ovl f" id="panelSeat">Faculty view</span>
      <div class="title" id="panelTitle">Prof. Marisol Vega</div>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>

  <div class="stage">
    <div class="center" id="center"></div>
    <aside class="margincol hide" id="margin"></aside>
  </div>
</main>

<div class="strip">
  <div>
    <div class="what" id="stripWhat">Evolv</div>
    <div class="ovl f" id="stripStage" style="margin-top:2px"></div>
  </div>
  <div class="why" id="stripWhy"></div>
  <div class="grow"></div>
  <div class="nav">
    <button class="btn small" id="btnBack">Back</button>
    <button class="btn solid" id="btnNext">Continue</button>
  </div>
</div>

</div><!-- /#app -->

<div class="pill" id="pill">
  <button data-act="update">Update</button>
  <div class="sep"></div>
  <button data-act="ask">Ask</button>
  <div class="sep"></div>
  <button data-act="tag">Tag for research</button>
  <div class="sep"></div>
  <button data-act="image">Generate image</button>
</div>

<div class="veil" id="veil"><div class="modal" id="modal"></div></div>

<script type="module" src="app.js"></script>
</body>
</html>
